name: auto_windows_build

on:
  push:
    paths:
      - "**/*.rs"
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - ".cargo/config.toml"
      - "assets/fonts/**/*"
      - "assets/icon/*"
      - "assets/windows/**/*"
      - "ci/deploy.sh"
      - "ci/windows-installer.iss"
      - "build-wezterm.ps1"
      - ".github/workflows/auto_windows_build.yml"
  workflow_dispatch:

concurrency:
  group: auto-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_WINDOWS_PATH_ADD_BIN: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Build release binaries
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --release -p wezterm -p wezterm-gui -p wezterm-mux-server -p strip-ansi-escapes

      - name: Prepare artifact files
        shell: pwsh
        run: |
          New-Item -Path dist -ItemType Directory -Force | Out-Null
          $bins = @(
            "wezterm.exe",
            "wezterm-gui.exe",
            "wezterm-mux-server.exe",
            "strip-ansi-escapes.exe"
          )

          foreach ($bin in $bins) {
            Copy-Item "target/release/$bin" "dist/$bin" -Force
          }

          Compress-Archive -Path dist/* -DestinationPath wezterm-windows-binaries.zip -Force

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: wezterm-windows-binaries-${{ github.sha }}
          path: |
            dist/*.exe
            wezterm-windows-binaries.zip
          retention-days: 14

  publish_nightly_release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: wezterm-windows-binaries-${{ github.sha }}

      - name: Generate checksums
        shell: bash
        run: |
          for f in *.exe wezterm-windows-binaries.zip; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create or update nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh release view nightly > /dev/null 2>&1; then
            gh release create nightly \
              --title "Nightly Build" \
              --notes "Automated Windows binaries from the latest main branch push." \
              --prerelease
          fi

          gh release upload --clobber nightly \
            *.exe \
            wezterm-windows-binaries.zip \
            *.sha256
